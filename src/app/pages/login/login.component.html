<section class="fourth-color login-section">
  <h1>Iniciar Sesión</h1>

  <form (submit)="login()" class="nice-form-group">
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        required
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        required
        class="form-control"
      />
    </div>
  </form>

  <button (click)="login()" type="submit" class="btn second-color">
    Ingresar
  </button>

  <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

  <button (click)="navigateToRegister()" class="btn second-color">
    Registrarse
  </button>

  <div class="rapid-buttons">
    <button
      class="btn quick-login"
      (click)="loginRapido('usuario@mail.com', '123123')"
    >
      Usuario
    </button>
    <button
      class="btn quick-login"
      (click)="loginRapido('admin@admin.com', '123123')"
    >
      Admin
    </button>
  </div>
</section>
