<div class="main-content">
  <div class="game-container">
    <div *ngFor="let game of games" class="game" (click)="irAJuego(game.route)">
      <img [src]="game.imgUrl" alt="{{ game.title }}" />
      <div class="game-info">
        <h3>{{ game.title }}</h3>
        <p>{{ game.description }}</p>
      </div>
    </div>
  </div>
</div>
