<div class="navbar">
  <div class="user-info" *ngIf="authService.user$ | async as user">
    <img src="icons/user.png" alt="Usuario icon" class="user-icon" />
    <span>{{ user?.email }}</span>
  </div>
  <div class="nav-links">
    <a *ngIf="!(authService.user$ | async)" (click)="navigateTo('/login')">
      <img src="icons/login.png" alt="login icon" class="icon" />
      Login
    </a>
    <a *ngIf="!(authService.user$ | async)" (click)="navigateTo('/register')">
      <img src="icons/register.png" alt="register icon" class="icon" />
      Registro
    </a>
    <a
      (click)="navigateTo('/quien-soy')"
      [ngClass]="{ 'quien-soy-right': !(authService.user$ | async) }"
    >
      <img src="icons/quien-soy.png" alt="quien-soy icon" class="icon" />
      Quién Soy
    </a>
    <a *ngIf="authService.user$ | async" (click)="navigateTo('/chat')">
      <img src="icons/chat.png" alt="chat icon" class="icon" />
      Chat
    </a>
    <a *ngIf="authService.user$ | async" (click)="logout()">
      <img src="icons/logout.png" alt="logout icon" class="icon" />
      Cerrar Sesión
    </a>
  </div>
</div>

<router-outlet></router-outlet>
